<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Apartment Management{% endblock %}</title>
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <style>
        body {
            background: url('https://wallpapers.com/images/hd/apartment-background-c3my6bomurl5yffk.jpg') no-repeat center center/cover;
            color: white;
            height: 100vh;
    width: 100vw;
    margin: 0;
    padding: 0;
    color: white;
    overflow: hidden;
        }
        .container {
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            margin-top: 50px;
        }
        .navbar {
            background: rgba(0, 0, 0, 0.8) !important;
        }
        .btn-custom {
            background: #ffc107;
            color: black;
            font-weight: bold;
        }
        .btn-custom:hover {
            background: #ff9800;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">🏠 Apartment Management</a>
            <div class="navbar-nav">
                {% if user.is_authenticated %}
                    <a class="nav-link btn btn-danger text-white px-3" href="{% url 'logout' %}">Logout</a>
                {% else %}
                    <a class="nav-link btn btn-light text-dark px-3 me-2" href="{% url 'login' %}">Login</a>
                    <a class="nav-link btn btn-custom px-3" href="{% url 'register' %}">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
